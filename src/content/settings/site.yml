newsletterHeadline: "Mindtivate Insights"
newsletterSubtext: "Health, fitness, beauty, hormones, relationships, and practical tips for living well, delivered to your inbox free."
# Contact form endpoint. This is a static site with no backend of its own,
# so the contact form needs a hosted form-handling service (Formspree,
# Sender.net, Netlify Forms, etc.) — set its submit URL here.
contactFormAction: "REPLACE_WITH_CONTACT_FORM_ACTION_URL"
# Google reCAPTCHA v2 ("I'm not a robot" checkbox) site key. Get one free at
# https://www.google.com/recaptcha/admin for this domain. Leave blank to
# skip rendering the CAPTCHA widget (the honeypot field still applies).
recaptchaSiteKey: ""
# Controls scripts/pipeline/8-weekly-digest.mjs, run weekly by
# .github/workflows/weekly-digest.yml. When true and there's at least one
# article published in the last 7 days, it creates an unsent draft
# broadcast in Resend (Broadcasts tab) for a human to review, edit, and
# send — nothing goes out automatically. Toggle here or via Pages CMS →
# Site settings.
weeklyDigestEnabled: false

