name: Weekly Pinterest pin drafts

# Finds published articles with no pinterestPinUrl yet and drafts a pin
# (image + Poe-drafted title/description) for a handful of them each
# run, opening a PR with the results. Nothing is ever posted to Pinterest
# from this workflow — the actual send only ever happens once a human
# sets "approved": true on a draft here, either by hand
# (--send) or picked up automatically by pinterest-auto-send.yml — see
# scripts/pipeline/5-pinterest-pin.mjs's header.

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft just this one article slug instead of the usual "up to 5 unpinned" scan (optional)'
        required: false
        type: string
      style:
        description: 'Pin style: photo (default, hero image + scrim) or infographic (AI-generated art + real composited takeaways) — see 5-pinterest-pin.mjs'
        required: false
        type: string
        default: photo
      limit:
        description: 'How many unpinned articles to draft this run (only applies without a slug input) — default matches the usual weekly scan'
        required: false
        type: string
        default: '5'
      autoApprove:
        description: 'Pre-set "approved": true on every draft this run creates, instead of the usual false — for a deliberate one-time bulk backfill only, not the normal weekly default'
        required: false
        type: boolean
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; create-pull-request
    # needs write access to push its branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Draft pin(s)
        # Manual runs can target one specific slug/style (e.g. to try the
        # infographic style on a single article before it's part of the
        # regular scan); the scheduled run and any manual run without a
        # slug input keep the original "top 5 unpinned, photo style"
        # behavior unchanged (limit defaults to '5').
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            slugs=("${{ inputs.slug }}")
          else
            mapfile -t slugs < <(node scripts/pipeline/find-unpinned-articles.mjs | head -"${{ inputs.limit || '5' }}")
          fi
          if [ ${#slugs[@]} -eq 0 ]; then
            echo "No published articles missing a Pinterest pin — nothing to draft."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::Drafting pin for $slug"
            npm run pipeline:pin -- --slug "$slug" --style "${{ inputs.style || 'photo' }}"
            if [ "${{ inputs.autoApprove }}" = "true" ]; then
              node -e "
                const fs = require('node:fs');
                const path = 'scripts/pipeline/pinterest-pin-drafts/${slug}.json';
                const draft = JSON.parse(fs.readFileSync(path, 'utf8'));
                draft.approved = true;
                fs.writeFileSync(path, JSON.stringify(draft, null, 2));
              "
            fi
            echo "::endgroup::"
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_INFOGRAPHIC_MODEL: ${{ vars.POE_INFOGRAPHIC_MODEL }}

      - name: Open PR with new pin draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new Pinterest pin draft(s) from pipeline'
          title: 'New Pinterest pin draft(s) for review'
          body: |
            Auto-generated by scripts/pipeline/5-pinterest-pin.mjs (stage 5).

            **Nothing has been posted to Pinterest.** Each drafted pin is a
            `.png` (the actual pin image) plus a `.json` (title/description/
            board category) under `scripts/pipeline/pinterest-pin-drafts/`.

            ${{ inputs.autoApprove == true && 'These were drafted with `"approved": true` already set, per a one-time bulk-backfill request -- review the images/copy below and flip any back to `false` first if one needs changes before it should be allowed to send.' || 'Each starts as `"approved": false`.' }}

            To review: open each `.png` in this PR's "Files changed" tab,
            check the drafted copy in its `.json`, edit either if you want,
            then set `"approved": true` if it isn't already. Once this PR
            is merged, an approved draft gets sent either:

            - automatically, next time `pinterest-auto-send.yml` runs
              (daily) — if `PINTEREST_ACCESS_TOKEN`/`PINTEREST_BOARD_ID`
              are configured as repo secrets, or
            - manually, by running (with your own Pinterest credentials):
              ```bash
              npm run pipeline:pin -- --slug <slug> --send
              ```

            Either way records the resulting `pinterestPinUrl` back onto
            the article automatically.
          branch: content/pinterest-pin-drafts-${{ github.run_number }}
          add-paths: |
            scripts/pipeline/pinterest-pin-drafts/**
