name: Weekly Pinterest pin drafts

# Finds published articles with no pinterestPinUrl yet and drafts a pin
# (image + Poe-drafted title/description) for a handful of them each
# run, opening a PR with the results. Nothing is ever posted to Pinterest
# from this workflow itself — the actual send only happens once
# pinterest-auto-send.yml (daily, capped at 5/run — see COMPLIANCE.md's
# "sustainable rate, not a scripted bulk-pin loop") picks up a draft
# marked "approved": true.
#
# Drafts are auto-approved by default (per explicit decision -- the
# per-pin human-review gate was deliberately dropped for the standing
# weekly schedule, trading away that safety check for full automation).
# A manual run can still set autoApprove to false to get the old
# review-before-send behavior back for a one-off case.

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft just these article slugs instead of the usual "up to 5 unpinned" scan (optional) -- one slug, or several separated by commas/newlines (e.g. to regenerate a batch of already-drafted slugs in a different style)'
        required: false
        type: string
      style:
        description: 'Pin style: photo (default, hero image + scrim) or infographic (AI-generated art + real composited takeaways) — see 5-pinterest-pin.mjs'
        required: false
        type: string
        default: photo
      limit:
        description: 'How many unpinned articles to draft this run (only applies without a slug input) — default matches the usual weekly scan'
        required: false
        type: string
        default: '5'
      autoApprove:
        description: 'Pre-set "approved": true on every draft this run creates (the standing default, including the scheduled run). Uncheck for a one-off manual run that should stay in the old review-before-send flow.'
        required: false
        type: boolean
        default: true

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; create-pull-request
    # needs write access to push its branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Draft pin(s)
        # Manual runs can target specific slug(s)/style (e.g. to try the
        # infographic style on one article before it's part of the regular
        # scan, or to regenerate a whole batch of already-drafted slugs in
        # a different style) -- comma/newline-separated so one dispatch can
        # cover many slugs in a single PR instead of one dispatch each. The
        # scheduled run and any manual run without a slug input keep the
        # original "top 5 unpinned, photo style" behavior unchanged (limit
        # defaults to '5').
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            mapfile -t slugs < <(printf '%s' "${{ inputs.slug }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          else
            mapfile -t slugs < <(node scripts/pipeline/find-unpinned-articles.mjs | head -"${{ inputs.limit || '5' }}")
          fi
          if [ ${#slugs[@]} -eq 0 ]; then
            echo "No published articles missing a Pinterest pin — nothing to draft."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::Drafting pin for $slug"
            # A single bad response (e.g. Poe occasionally returns
            # malformed JSON) must not take down the whole batch -- under
            # `bash -e`, letting this command's failure propagate would
            # abort the entire loop, discarding every already-successful
            # draft in this run too (the "Open PR" step never runs on a
            # failed job). Skip just this slug and continue instead; it
            # has no draft file written, so the next run's
            # find-unpinned-articles.mjs scan picks it up again
            # automatically.
            if ! npm run pipeline:pin -- --slug "$slug" --style "${{ inputs.style || 'photo' }}"; then
              echo "::warning::Drafting failed for $slug -- skipping, will be retried on a future run"
              echo "::endgroup::"
              continue
            fi
            # inputs.autoApprove is "" (not "true"/"false") on the
            # scheduled run -- only an explicit "false" from a manual
            # dispatch should skip auto-approval; anything else
            # (including the scheduled run) auto-approves, per the
            # standing default described above.
            if [ "${{ inputs.autoApprove }}" != "false" ]; then
              node -e "
                const fs = require('node:fs');
                const path = 'scripts/pipeline/pinterest-pin-drafts/${slug}.json';
                const draft = JSON.parse(fs.readFileSync(path, 'utf8'));
                draft.approved = true;
                fs.writeFileSync(path, JSON.stringify(draft, null, 2));
              "
            fi
            echo "::endgroup::"
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_INFOGRAPHIC_MODEL: ${{ vars.POE_INFOGRAPHIC_MODEL }}

      - name: Open PR with new pin draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new Pinterest pin draft(s) from pipeline'
          title: 'New Pinterest pin draft(s) for review'
          body: |
            Auto-generated by scripts/pipeline/5-pinterest-pin.mjs (stage 5).

            **Nothing has been posted to Pinterest by this PR itself.** Each
            drafted pin is a `.png` (the actual pin image) plus a `.json`
            (title/description/board category) under
            `scripts/pipeline/pinterest-pin-drafts/`.

            Drafts come with `"approved": true` already set by default (the
            standing default — merging this PR is enough to let them start
            sending). If this was a manual run with `autoApprove` unchecked,
            each draft instead starts `"approved": false` — check each
            `.json` if you're not sure which applies here. Either way, flip
            a draft back to `"approved": false` first if it needs changes
            before it should be allowed to send.

            Once merged, each approved draft gets sent either:

            - automatically, next time `pinterest-auto-send.yml` runs
              (daily) — needs `BUFFER_API_KEY` configured as a repo
              secret, or
            - manually, by running (with `BUFFER_API_KEY` set):
              ```bash
              npm run pipeline:pin -- --slug <slug> --send
              ```

            Either way records the resulting `pinterestPinUrl` back onto
            the article automatically.
          branch: content/pinterest-pin-drafts-${{ github.run_number }}
          add-paths: |
            scripts/pipeline/pinterest-pin-drafts/**
