name: Weekly Pinterest pin drafts

# Finds published articles with no pinterestPinUrl yet and drafts a pin
# (image + Poe-drafted title/description) for a handful of them each
# run, opening a PR with the results. Nothing is ever posted to Pinterest
# from this workflow — see scripts/pipeline/5-pinterest-pin.mjs's header
# for why the actual send stays a manual, local, human-run step.

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft just this one article slug instead of the usual "up to 5 unpinned" scan (optional)'
        required: false
        type: string
      style:
        description: 'Pin style: photo (default, hero image + scrim) or infographic (AI-generated art + real composited takeaways) — see 5-pinterest-pin.mjs'
        required: false
        type: string
        default: photo

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; create-pull-request
    # needs write access to push its branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Draft pin(s)
        # Manual runs can target one specific slug/style (e.g. to try the
        # infographic style on a single article before it's part of the
        # regular scan); the scheduled run and any manual run without a
        # slug input keep the original "top 5 unpinned, photo style"
        # behavior unchanged.
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            slugs=("${{ inputs.slug }}")
          else
            mapfile -t slugs < <(node scripts/pipeline/find-unpinned-articles.mjs | head -5)
          fi
          if [ ${#slugs[@]} -eq 0 ]; then
            echo "No published articles missing a Pinterest pin — nothing to draft."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::Drafting pin for $slug"
            npm run pipeline:pin -- --slug "$slug" --style "${{ inputs.style || 'photo' }}"
            echo "::endgroup::"
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_INFOGRAPHIC_MODEL: ${{ vars.POE_INFOGRAPHIC_MODEL }}

      - name: Open PR with new pin draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new Pinterest pin draft(s) from pipeline'
          title: 'New Pinterest pin draft(s) for review'
          body: |
            Auto-generated by scripts/pipeline/5-pinterest-pin.mjs (stage 5).

            **Nothing has been posted to Pinterest.** Each drafted pin is a
            `.png` (the actual pin image) plus a `.json` (title/description/
            board category, `"approved": false`) under
            `scripts/pipeline/pinterest-pin-drafts/`.

            To review: open each `.png` in this PR's "Files changed" tab,
            check the drafted copy in its `.json`, edit either if you want,
            then set `"approved": true`. Once this PR is merged, run
            (with your own Pinterest credentials):

            ```bash
            npm run pipeline:pin -- --slug <slug> --send
            ```

            for each approved draft — this records the resulting
            `pinterestPinUrl` back onto the article automatically.
          branch: content/pinterest-pin-drafts-${{ github.run_number }}
          add-paths: |
            scripts/pipeline/pinterest-pin-drafts/**
