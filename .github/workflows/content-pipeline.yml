name: Content pipeline (research → draft PR)

# Runs the research + drafting stages of the pipeline and opens a PR with a
# new draft article for a human to review in Pages CMS or GitHub before it's
# merged. It never publishes directly, posts to Reddit, or creates a
# Pinterest pin — see docs/CONTENT_PIPELINE.md for why those stay
# human-triggered.

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research Reddit pain points
        run: npm run pipeline:research
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      - name: Match candidate products
        run: npm run pipeline:match

      - name: Draft article with Claude
        run: npm run pipeline:draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

      - name: Open PR with new draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new article draft(s) from pipeline'
          title: 'New article draft(s) for review'
          body: |
            Auto-generated by the content pipeline (research → product match → Claude draft).

            **Nothing here is published.** Every new file under
            `src/content/articles/` has `status: draft` and `draft: true`.
            Review in Pages CMS, verify affiliate links/status on any
            referenced product, then flip status to `published` and merge.
          branch: content/pipeline-draft-${{ github.run_number }}
          add-paths: |
            src/content/articles/**
            src/content/products/**
