name: Content pipeline (research → draft, push to main)

# Runs the research + drafting stages of the pipeline and, once the site
# still builds cleanly with the new file(s) added, commits and pushes
# straight to main -- no PR, no merge step. This is safe specifically
# because every drafted article is always written with draft: true (see
# 3-generate-article.mjs), which is what keeps it off the live site, RSS
# feed, and homepage regardless of anything else; landing the file on
# main just makes it show up in Pages CMS immediately for review there,
# instead of sitting invisible on an unmerged PR branch until someone
# notices and merges it. It never publishes directly, posts to Reddit,
# or creates a Pinterest pin — see docs/CONTENT_PIPELINE.md for why
# those stay human-triggered.
#
# The build-first-abort-otherwise step is the actual safety net: Astro
# validates every article's frontmatter against the content schema at
# build time, even draft ones, so a malformed draft (bad category value,
# broken YAML) would otherwise break the live site's build the moment it
# landed on main. If the build fails, nothing is committed -- the run
# just ends, and today's candidates get reconsidered on a future run via
# the same dedup logic that normally skips already-covered threads.

on:
  schedule:
    # 06:00 Hong Kong Time (UTC+8, no DST) = 22:00 UTC the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; pushing straight to
    # main needs write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research Reddit pain points
        # Reads Arctic Shift, not Reddit's own API — no Reddit app,
        # approval, or account secrets needed here. See docs/SETUP.md.
        run: npm run pipeline:research

      - name: Match candidate products
        run: npm run pipeline:match
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}

      - name: Draft up to 3 articles with Poe
        # --index selects which brief (0 = top candidate) from the latest
        # product-briefs file; looping 0-2 drafts the top 3 instead of just
        # one. `|| echo ...` keeps a day with fewer than 3 candidates from
        # failing the whole job — pipeline:draft exits non-zero when an
        # index doesn't exist, which would otherwise abort the step (and
        # any indices after it) on `set -e`, GitHub Actions' default.
        run: |
          for i in 0 1 2; do
            npm run pipeline:draft -- --index "$i" || echo "No brief at index $i — skipping."
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_IMAGE_MODEL: ${{ vars.POE_IMAGE_MODEL }}
          POE_SEARCH_MODEL: ${{ vars.POE_SEARCH_MODEL }}

      - name: Check for new draft(s)
        id: check
        run: |
          if git status --porcelain -- src/content/articles src/content/products | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new/changed files under src/content/articles or src/content/products — nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the site still builds
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push straight to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles src/content/products
          git commit \
            -m 'content: new article draft(s) from pipeline' \
            -m "Nothing here is published -- every new/updated file has status: draft and draft: true. Review in Pages CMS: verify affiliate links/status on any referenced product, confirm any amazon.com-sourced product image (flagged with a comment in the product's frontmatter) actually matches before it goes live, and spot-check any cited source links, then flip status to published."
          git push origin HEAD:main
