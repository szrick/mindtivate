name: Content pipeline (research → draft → edit → publish)

# Runs the full pipeline unattended: research, draft, an automated
# editorial pass, then publishes straight to main — no PR, no human
# review step. Stage 3 always drafts with draft: true first; stage 4
# (the editor, 4-edit-and-publish.mjs) then checks the hero image for
# baked-in text, reviews/repairs external and internal links, attaches a
# real affiliate product if a genuinely relevant one exists, and only
# then flips the article to status: published, draft: false. If stage 4
# fails partway through one article, that article is left as a draft
# rather than published half-reviewed — see the comment at the top of
# 4-edit-and-publish.mjs.
#
# The build-first-abort-otherwise step below is the real safety net:
# Astro validates every article's frontmatter against the content schema
# at build time, so a malformed article (bad category value, broken
# YAML, a stray reference) would otherwise break the live site's build
# the moment it landed on main — published or not. If the build fails,
# nothing is committed — the run just ends, and today's candidates get
# reconsidered on a future run via the same dedup logic that normally
# skips already-covered threads.
#
# This never posts to Reddit or creates a Pinterest pin on its own — see
# docs/CONTENT_PIPELINE.md for why those stay human-triggered.

on:
  schedule:
    # 06:00 Hong Kong Time (UTC+8, no DST) = 22:00 UTC the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; pushing straight to
    # main needs write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research Reddit pain points
        # Reads Arctic Shift, not Reddit's own API — no Reddit app,
        # approval, or account secrets needed here. See docs/SETUP.md.
        run: npm run pipeline:research

      - name: Match candidate products
        run: npm run pipeline:match
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}

      - name: Draft up to 3 articles with Poe
        # --index selects which brief (0 = top candidate) from the latest
        # product-briefs file; looping 0-2 drafts the top 3 instead of just
        # one. `|| echo ...` keeps a day with fewer than 3 candidates from
        # failing the whole job — pipeline:draft exits non-zero when an
        # index doesn't exist, which would otherwise abort the step (and
        # any indices after it) on `set -e`, GitHub Actions' default.
        run: |
          for i in 0 1 2; do
            npm run pipeline:draft -- --index "$i" || echo "No brief at index $i — skipping."
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_IMAGE_MODEL: ${{ vars.POE_IMAGE_MODEL }}
          POE_SEARCH_MODEL: ${{ vars.POE_SEARCH_MODEL }}

      - name: Edit and publish today's draft(s)
        # Reviews whatever 3-generate-article.mjs just drafted (discovered
        # via `git status` — see 4-edit-and-publish.mjs) and, once each one
        # passes, flips it to status: published, draft: false. Non-fatal
        # per article: a failure on one draft leaves it as-is (still
        # draft: true) rather than blocking the others or failing the job.
        run: npm run pipeline:edit
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_VISION_MODEL: ${{ vars.POE_VISION_MODEL }}
          POE_IMAGE_MODEL: ${{ vars.POE_IMAGE_MODEL }}

      - name: Check for new/changed file(s)
        id: check
        run: |
          if git status --porcelain -- src/content/articles src/content/products | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new/changed files under src/content/articles or src/content/products — nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the site still builds
        if: steps.check.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push straight to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles src/content/products
          git commit \
            -m 'content: publish new article(s) from the automated pipeline' \
            -m "Drafted, edited (hero image text check, link review, internal-link backfill, affiliate-product match), and published automatically — see docs/CONTENT_PIPELINE.md stage 4. Any file still showing status: draft failed part of the editorial pass and needs manual attention in Pages CMS."
          git push origin HEAD:main
