name: Content pipeline (research → draft PR)

# Runs the research + drafting stages of the pipeline and opens a PR with
# up to 3 new draft articles (fewer on a day with fewer new candidates) for
# a human to review in Pages CMS or GitHub before merging. It never
# publishes directly, posts to Reddit, or creates a Pinterest pin — see
# docs/CONTENT_PIPELINE.md for why those stay human-triggered.

on:
  schedule:
    # 06:00 Hong Kong Time (UTC+8, no DST) = 22:00 UTC the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; create-pull-request
    # needs write access to push its branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research Reddit pain points
        # Reads Arctic Shift, not Reddit's own API — no Reddit app,
        # approval, or account secrets needed here. See docs/SETUP.md.
        run: npm run pipeline:research

      - name: Match candidate products
        run: npm run pipeline:match
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}

      - name: Draft up to 3 articles with Poe
        # --index selects which brief (0 = top candidate) from the latest
        # product-briefs file; looping 0-2 drafts the top 3 instead of just
        # one. `|| echo ...` keeps a day with fewer than 3 candidates from
        # failing the whole job — pipeline:draft exits non-zero when an
        # index doesn't exist, which would otherwise abort the step (and
        # any indices after it) on `set -e`, GitHub Actions' default.
        run: |
          for i in 0 1 2; do
            npm run pipeline:draft -- --index "$i" || echo "No brief at index $i — skipping."
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          POE_IMAGE_MODEL: ${{ vars.POE_IMAGE_MODEL }}
          POE_SEARCH_MODEL: ${{ vars.POE_SEARCH_MODEL }}

      - name: Open PR with new draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new article draft(s) from pipeline'
          title: 'New article draft(s) for review'
          body: |
            Auto-generated by the content pipeline (research → product match → Poe draft + images).

            **Nothing here is published.** Every new file under
            `src/content/articles/` has `status: draft` and `draft: true`.
            Review in Pages CMS: verify affiliate links/status on any
            referenced product, confirm any amazon.com-sourced product
            image (flagged with a comment in the product's frontmatter)
            actually matches before it goes live, and spot-check any
            cited source links, then flip status to `published` and merge.
          branch: content/pipeline-draft-${{ github.run_number }}
          add-paths: |
            src/content/articles/**
            src/content/products/**
