name: Debug YouTube video lookup

# One-off, manual-only diagnostic: prints a video's real server-side
# snippet/status/processingDetails (scripts/pipeline/debug-check-video.mjs)
# so a question like "did the custom thumbnail actually get set?" can be
# answered against the real API response, not Studio's UI (which can lag
# behind what's actually registered). Nothing here changes any video --
# read-only lookup.

on:
  workflow_dispatch:
    inputs:
      videoId:
        description: 'YouTube video ID to look up (from a draft''s youtubeStudioUrl, e.g. the part after /video/)'
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Look up video
        run: node scripts/pipeline/debug-check-video.mjs --video-id "${{ inputs.videoId }}"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
