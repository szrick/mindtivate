name: Weekly internal-link backfill

# Finds published articles with fewer than 2 internal links (oldest
# first -- these are the ones most likely written before enough other
# articles existed to link to) and asks Poe to propose 0-2 new inline
# links per article, using scripts/pipeline/9-backfill-internal-links.mjs
# (stage 9). Opens a PR with the resulting diffs; nothing merges on its
# own -- review means reading the changed sentences right in the PR, same
# as every other scheduled drafting step in this pipeline.

on:
  schedule:
    - cron: '0 18 * * 1' # Mondays 18:00 UTC
  workflow_dispatch:

jobs:
  relink:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; create-pull-request
    # needs write access to push its branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backfill internal links for up to 5 articles
        run: npm run pipeline:relink -- --limit 5
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}

      - name: Open PR with internal-link updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: backfill internal links (stage 9)'
          title: 'Internal link backfill for review'
          body: |
            Auto-generated by scripts/pipeline/9-backfill-internal-links.mjs (stage 9).

            Proposes 0-2 new inline links per article, only where an
            existing sentence genuinely calls for one — review each
            changed line like any other edit before merging. Only
            `updatedDate` and the linked sentence(s) change; nothing
            else about the article is touched.
          branch: content/internal-links-${{ github.run_number }}
          add-paths: |
            src/content/articles/**
