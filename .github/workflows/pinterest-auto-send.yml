name: Pinterest auto-send approved pins

# Sends any Pinterest pin draft that's already been marked
# "approved": true in scripts/pipeline/pinterest-pin-drafts/*.json but
# hasn't been sent yet -- see scripts/pipeline/5-pinterest-pin.mjs's
# --send-approved. The human gate is still the approval itself (set by
# hand, reviewing the actual image/copy in a weekly-pinterest-pins.yml
# PR, same as always); this workflow only automates the "click send"
# step for whatever's already been approved, capped at 5 per run with a
# delay between each (see MAX_SENDS_PER_RUN in 5-pinterest-pin.mjs) so a
# pile of approvals merged at once doesn't turn into a burst-post.
#
# Sends via this project's own Pinterest app directly
# (scripts/lib/pinterest.mjs), now that it has Pinterest's general
# (Standard) API access -- the earlier Buffer workaround (while on
# Trial access) is no longer needed. Needs PINTEREST_ACCESS_TOKEN, or
# PINTEREST_APP_ID/PINTEREST_APP_SECRET/PINTEREST_REFRESH_TOKEN so
# refreshAccessToken() can mint a fresh token each run instead of
# depending on a static token someone has to rotate by hand every 30
# days. The Pinterest board id per category still comes from
# scripts/lib/pinterest-boards.json.

on:
  schedule:
    - cron: '0 15 * * *' # daily, 15:00 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: 'Send just this one approved draft now, instead of the usual "oldest 5 by directory order" batch -- useful when a specific pin needs to go out ahead of an older queue (e.g. verifying a just-fixed draft actually sends). Must already be approved: true.'
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; pushing the
    # updated draft(s) and article(s) straight to main needs write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send approved, unsent drafts
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            npm run pipeline:pin -- --slug "${{ inputs.slug }}" --send
          else
            npm run pipeline:pin -- --send-approved
          fi
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Check for changed draft(s)/article(s)
        id: check
        run: |
          if git status --porcelain -- scripts/pipeline/pinterest-pin-drafts src/content/articles | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No draft/article changes — nothing was sent, or nothing needed sending."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push straight to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pipeline/pinterest-pin-drafts src/content/articles
          git commit -m 'content: record sent Pinterest pin(s)' \
            -m 'Sent by pinterest-auto-send.yml for draft(s) already marked approved: true — see the sentAt/pinUrl fields for which.'
          git push origin HEAD:main
