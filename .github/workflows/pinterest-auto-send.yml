name: Pinterest auto-send approved pins

# Sends any Pinterest pin draft that's already been marked
# "approved": true in scripts/pipeline/pinterest-pin-drafts/*.json but
# hasn't been sent yet -- see scripts/pipeline/5-pinterest-pin.mjs's
# --send-approved. The human gate is still the approval itself (set by
# hand, reviewing the actual image/copy in a weekly-pinterest-pins.yml
# PR, same as always); this workflow only automates the "click send"
# step for whatever's already been approved, capped at 5 per run with a
# delay between each (see MAX_SENDS_PER_RUN in 5-pinterest-pin.mjs) so a
# pile of approvals merged at once doesn't turn into a burst-post.
#
# Sends via Buffer (scripts/lib/buffer.mjs), not this project's own
# Pinterest app -- Buffer is an already-Standard-access Pinterest
# Marketing Developer Partner, so this works now instead of waiting on
# this app's own Trial->Standard review. Only needs BUFFER_API_KEY; the
# Pinterest board id per category still comes from
# scripts/lib/pinterest-boards.json (same board ids Buffer's
# boardServiceId expects).

on:
  schedule:
    - cron: '0 15 * * *' # daily, 15:00 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only on this repo; pushing the
    # updated draft(s) and article(s) straight to main needs write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send approved, unsent drafts
        run: npm run pipeline:pin -- --send-approved
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Check for changed draft(s)/article(s)
        id: check
        run: |
          if git status --porcelain -- scripts/pipeline/pinterest-pin-drafts src/content/articles | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No draft/article changes — nothing was sent, or nothing needed sending."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push straight to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pipeline/pinterest-pin-drafts src/content/articles
          git commit -m 'content: record sent Pinterest pin(s)' \
            -m 'Sent by pinterest-auto-send.yml for draft(s) already marked approved: true — see the sentAt/pinUrl fields for which.'
          git push origin HEAD:main
