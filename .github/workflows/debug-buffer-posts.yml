name: Debug Buffer posts lookup

# One-off, manual-only diagnostic: introspects Buffer's GraphQL schema
# for a way to check a post's real status after creation
# (scripts/pipeline/debug-buffer-posts.mjs). createPost returning
# PostActionSuccess only means Buffer accepted the post, not that it
# actually went live on Pinterest -- this is read-only, changes nothing.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Look up Buffer posts
        run: node scripts/pipeline/debug-buffer-posts.mjs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
