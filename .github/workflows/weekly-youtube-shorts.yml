name: Weekly YouTube Shorts drafts

# Finds published articles with no youtubeShortUrl yet and drafts a
# Short (script + ElevenLabs voiceover + Pexels/Pixabay B-roll + burned-in
# captions, assembled with ffmpeg) for a handful of them each run,
# uploading each as a PRIVATE YouTube video and opening a PR with the
# small JSON draft record. Nothing is ever made public from this workflow
# -- the actual publish only happens once youtube-auto-publish.yml (daily,
# capped at MAX_PUBLISHES_PER_RUN -- see YouTube Data API's daily quota
# note in 12-youtube-short.mjs) picks up a draft marked "approved": true.
#
# Unlike Pinterest's standing auto-approve default, this format is new
# and unproven -- autoApprove defaults to false here. A human should
# actually watch the first several private uploads on youtube.com before
# this graduates to auto-approving, the same way Pinterest's own
# auto-approve default was only adopted after a deliberate decision, not
# from day one.

on:
  schedule:
    - cron: '0 16 * * 3' # Wednesdays 16:00 UTC -- offset from Pinterest's Monday run so the two don't compete for review attention the same day
  workflow_dispatch:
    inputs:
      slug:
        description: 'Draft just this one article slug instead of the usual "up to N without a Short" scan (optional)'
        required: false
        type: string
      limit:
        description: 'How many articles to draft Shorts for this run (only applies without a slug input) -- kept low by default: each Short costs real ElevenLabs/compute time, unlike a Pinterest pin'
        required: false
        type: string
        default: '2'
      autoApprove:
        description: 'Pre-set "approved": true on every draft this run creates. Leave unchecked (the default) until this format has a track record -- see this file''s header comment.'
        required: false
        type: boolean
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        # Not preinstalled on GitHub-hosted ubuntu-latest runners as of
        # this writing (confirmed live: "ffmpeg: command not found" when
        # this step was just `ffmpeg -version`) -- install it explicitly
        # rather than assuming it's already there.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version

      - name: Draft Short(s)
        # Same per-slug failure isolation as weekly-pinterest-pins.yml's
        # drafting loop (see that file's comment for the full reasoning):
        # one bad Poe/ElevenLabs/stock-footage/YouTube-upload response
        # must not discard every already-successful draft earlier in this
        # same run.
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            slugs=("${{ inputs.slug }}")
          else
            mapfile -t slugs < <(node scripts/pipeline/find-articles-without-short.mjs | head -"${{ inputs.limit || '2' }}")
          fi
          if [ ${#slugs[@]} -eq 0 ]; then
            echo "No published articles missing a YouTube Short -- nothing to draft."
            exit 0
          fi
          for slug in "${slugs[@]}"; do
            echo "::group::Drafting Short for $slug"
            if ! npm run pipeline:short -- --slug "$slug"; then
              echo "::warning::Drafting failed for $slug -- skipping, will be retried on a future run"
              echo "::endgroup::"
              continue
            fi
            if [ "${{ inputs.autoApprove }}" = "true" ]; then
              node -e "
                const fs = require('node:fs');
                const path = 'scripts/pipeline/youtube-short-drafts/${slug}.json';
                const draft = JSON.parse(fs.readFileSync(path, 'utf8'));
                draft.approved = true;
                fs.writeFileSync(path, JSON.stringify(draft, null, 2));
              "
            fi
            echo "::endgroup::"
          done
        env:
          POE_API_KEY: ${{ secrets.POE_API_KEY }}
          POE_MODEL: ${{ vars.POE_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      - name: Open PR with new Short draft(s)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'content: new YouTube Short draft(s) from pipeline'
          title: 'New YouTube Short draft(s) for review'
          body: |
            Auto-generated by scripts/pipeline/12-youtube-short.mjs (stage 12).

            **Nothing has been made public by this PR.** Each drafted Short
            is already uploaded to YouTube as a **private** video -- only
            someone signed into the connected channel can see it. This PR
            just carries the small JSON draft record
            (`scripts/pipeline/youtube-short-drafts/*.json`): script text,
            B-roll sources/attributions, and a `youtubeStudioUrl` link.

            **To review: click each draft's `youtubeStudioUrl` and actually
            watch the private video.** The JSON diff alone doesn't show you
            the finished video. Once you're happy with it, set
            `"approved": true` in the JSON (unless this run already did,
            see `autoApprove`) and merge this PR.

            Once merged, each approved draft gets published (flips
            private -> public) either:

            - automatically, next time `youtube-auto-publish.yml` runs
              (daily) -- needs the YouTube OAuth secrets configured, or
            - manually, by running:
              ```bash
              npm run pipeline:short -- --slug <slug> --publish
              ```

            Either way records the resulting `youtubeShortUrl` back onto
            the article automatically.
          branch: content/youtube-short-drafts-${{ github.run_number }}
          add-paths: |
            scripts/pipeline/youtube-short-drafts/**
